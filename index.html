<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Camino Juntos</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Commissioner:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

    @font-face {
        font-family: 'MisTitulosY2K';
        src: url('titles.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        unicode-range: U+0020-002F, U+003A-007E, U+00A0-00FF, U+0100-017F;
    }

    @font-face {
        font-family: 'MiTextoGeneral';
        src: url('body.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }
        @font-face {
        font-family: 'MisTitulosY2K';
        src: url('body.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        unicode-range: U+0030-0039;
    }
body {
        background: url('fondo.png') no-repeat center center fixed, radial-gradient(circle at top left, #ff9ebb, #ff007f);
    background-size: cover;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
}


        .journey-container {
    background: rgba(255, 182, 210, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 30px 25px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(255, 0, 127, 0.3);
    max-width: 550px;
    width: 100%;
    border: 2px solid #baffc9;
    position: relative;
}

                /* DISEÑO Y ANIMACIÓN DE TU IMAGEN DE BICICLETA */
        .bike-container {
            margin-bottom: 10px;
            display: inline-block;
            filter: drop-shadow(0 0 12px rgba(186, 255, 201, 0.6)); /* Brillo verde menta */
            animation: pedalear 3s ease-in-out infinite alternate;
        }

        .bike-img {
            max-width: 120px; /* Ajusta este número si quieres que se vea más grande o pequeña */
            height: auto;
        }

        @keyframes pedalear {
            0% { transform: translateX(-10px) rotate(-4deg); }
            100% { transform: translateX(10px) rotate(4deg); }
        }

    h1 { 
    color: #ffffff; 
    margin-bottom: 5px; 
        font-family: 'MisTitulosY2K', sans-serif;
    font-size: 2rem; 
    text-shadow: 2px 2px 0px #ff007f;
}
.flower-img {
    max-width: 160px;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    margin: 10px 0;
    border: 3px solid #baffc9;
}
.timer {
    font-family: 'MiTextoGeneral', sans-serif;
    
    font-size: 2.2rem;
    font-weight: bold;
    color: #baffc9; 
    background: rgba(255, 0, 127, 0.6); 
    padding: 10px 20px;
    border-radius: 40px;
    display: inline-block;
    margin: 20px 0;
    letter-spacing: 1px;
    border: 2px solid #ffffff;
}

.message-box {
    font-family: 'MiTextoGeneral', sans-serif;
    font-size: 1.15rem;
    line-height: 1.7;
    color: #ffffff; /* Texto de las cartas en blanco para que resalte */
    display: none;
    background: rgba(255, 255, 255, 0.15);
    padding: 20px;
    border-radius: 15px;
    text-align: left;
    animation: aparecer 0.8s ease-out forwards;
}

button {
    background: #baffc9;
    color: #ff007f;
    border: none;
    padding: 14px 28px;
    font-family: 'MisTitulosY2K', sans-serif;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(186, 255, 201, 0.4);
    transition: all 0.3s;
    font-weight: bold;
}
button:hover { 
    transform: scale(1.05);
    background: #ffffff;
}

        @keyframes aparecer { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
                /* Estilos para fijar las imágenes en las esquinas */
        .bg-corner {
            position: fixed;
            z-index: -1; /* Hace que se queden DETRÁS de la tarjeta principal */
            height: auto;
            pointer-events: none; /* Evita que estorben si se hace clic sobre ellas */
            opacity: 0.85; /* Un toque de transparencia estilo aesthetic */
        }

        /* Esquina Inferior Izquierda */
        .corner-left {
            bottom: 0;
            left: 0;
        }

        /* Esquina Superior Derecha */
        .corner-right {
            top: 0;
            right: 0;
        }

        /* Ajuste automático para que en celulares no tapen la tarjeta del centro */
        @media (max-width: 768px) {
            .bg-corner {
          
                opacity: 0.5; /* Se vuelven más sutiles */
            }
        }
  /* Contenedor que alinea las fotos una al lado de la otra de forma estricta */
.message-gallery {
    display: table;
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 10px 0;
    margin-top: 15px;
    box-sizing: border-box;
}

/* Diseño individual de cada una de las dos fotos */
.gallery-img {
    display: table-cell;
    width: 50%;
    max-width: 50%;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    border: 2px solid #baffc9;
}





    </style>
</head>
<body>
    <img src="hbd.png" class="bg-corner corner-left" alt="decoracion">
    <img src="mainpc.png" class="bg-corner corner-right" alt="decoracion">

    <div class="journey-container">

         <div class="bike-container">
                <img src="bikeicon.jpg" class="bike-img" alt="bicicleta">
            </div>
        <h1 id="route-title">Tu viaje en bicicleta</h1>
        <div id="flower" class="flower-badge">--</div>
        <div id="countdown" class="timer">00:00:00</div>
        <div id="content" class="message-box"></div>
    </div>

    <script>
        const stages = [
            {
                targetDate: new Date(2020, 8, 15, 0, 0, 0), 
                title: "Parada 1: Cosmos de Cassiopea",
                flower: '<img src="cosmos.png" class="flower-img">',
                message: "Queridísimo Natsu, estoy segura que sería más feliz de conocernos un poco mejor. Sin embargo, lo que tenemos me ha bastado para saber el tipo de persona que eres y lo bonito de tu personalidad; has sido muy amable conmigo, así que lo aprecio.<br><br>Y por primera vez te puedo felicitar en tu cumpleaños. ¡Espero que sea grandioso!, me encantan como fechas a recordar y recopilar amor, muchos regalos y comida deliciosa~ que seas super duper feliz, agradezco el chance de participar y desearte cosas bonitas. Que de aquí a un año crezcas más y tengas experiencias qué recordar tal como las tienes ahora, titititi.<br><br><b>Con muchísimo cariño, Cass</b>"
            },
            {
                targetDate: new Date(2020, 8, 16, 0, 0, 0), 
                title: "Parada 2: Miniorquídeas de Kuro",
                flower: '<img src="miniorquideas.png" class="flower-img">',
                message: "<b>Natcito gemelito de las pecas en su carita. Qué bonito tener motivos para celebrar, pero más bonito es que lo celebren a uno siempre, y sin embargo, esta es la mejor oportunidad para expresar lo que poco se dice. Espero que entre tantas flores te sientas apreciado, florecitas bonitas que no perecen, pero que ojalá te adornen de sonrisas los días. Te deseo un cumpleaños sin arrepentimientos y con muchas esperanzas a venir, que la pases lindo y que se te cumpla cada deseo y como dicen en mis tierras coreanas, te partan el bizcocho.</b><br><br>Te quiero mucho y un abrazo fuerrrrrrrte"
            },
            {
                targetDate: new Date(2020, 8, 17, 0, 0, 0), 
                title: "Parada 3: Tulipanes de Sweny",
                flower: '<img src="tulipanes.png" class="flower-img">',
                message: "<b>¡Feliz día Natsu! ¿Qué se siente darle una nueva vuelta al sol? Espero que este año que pasó, lo hayas llenado de preciosos recuerdos y también muchas experiencias de esas que nos construyen como mejores personas. Agradezco muchisimo haberme cruzado contigo en esta vida y aunque casi no hablemos, siempre serás para mi un solecito que un día me iluminó con su rayo y me devolvió una sonrisa el día que pensé que solo vivía en la sombra. Te deseo momentos maravillosos para este nuevo año, mucho amor (cantidades excesivas) buenos recuedos y muchas risas.</b><br><br>Con cariño, Sweny."
            },
            {
                targetDate: new Date(2020, 8, 18, 0, 0, 0), 
                title: "Parada 4: Cerezos de Dani",
                flower: '<img src="cerezos.png" class="flower-img">',
               message: "<b>Para mi querido Solecito, Sé que el tiempo ha puesto algo de distancia entre nosotros, lo que no significa que no quiera estar presente el día de hoy porque ¡es tu cumpleaños! Y es una fecha que debiese ser celebrada con todo en lo alto. Nat, solecito encantador, decir lo que me agrada de ti es difícil porque no puedo separarte en partes: todo tú eres un encanto. Solo quisiera que te vieras con los ojos de todos los que te queremos para que lo tengas más que claro. Que este nuevo año te traiga solo felicidad, cosito. Nunca dudes de que estaré por ahí si me necesitas.</b><br><br>- Nani."
            },
            {
                targetDate: new Date(2020, 8, 19, 0, 0, 0), 
                title: "Parada 5: Hibiscos de Kory",
                flower: '<img src="hibiscus.png" class="flower-img">',
                 message: "<b>Mi querido Natsu bebé; parece que nos conocemos hace una eternidad, ¿verdad? A veces cuando trato de hacer memoria de cuánto hace que nos conocemos, me doy cuenta de que ha pasado realmente mucho tiempo y sin importar qué locuras haga o qué brote psicótico esté atravesando yo, siempre estás ahí conmigo. Decirte que eres mi mejor amigo se queda corto porque simplemente eres más que eso, mi hermano, mi confidente, mi compañero de travesuras y de locuras, mi oído y mi refugio. Siempre que necesito hacer algo divertido o un lugar dónde juzgar y criticar a todos, tú estás ahí conmigo, y aunque ya hemos pasado de todo juntos, (tú sabes qué) espero que podamos seguir pasando por más, siempre unidos como los buenos hermanos amigos que somos. Gracias por todo este tiempo juntos, deseo que te guste el ramito que elegí para ti con tanto amor, y es que los hibiscos tienen un montón de significados a lo largo de las culturas y sus variaciones, pero para dejarlo en un significado simple, en el hibisco veo lo mismo que en ti, un símbolo de resilencia, una persona apasionada en todo lo que hace y la profunda admiración que siento hacia ti. ¡Feliz cumpleaños, mi bebito hermoso! Te quiero mucho, puedes contar conmigo PARA CUALQUIER COSA, cualquier cosa loca que pase por tu cabeza, voy a estar ahí para secundarte y en tus momentos más azules, también te aseguro un lugar en mi hombro. Que pases un cumpleaños muy feliz, eres amado por muchísimas personas aunque pienses que somos pocos, pero esos pocos somos increíblemente leales a ti. </b><br><br>¡Seamos amigos por diez mil años más! ♡"   
            },
            {
                targetDate: new Date(2020, 8, 20, 0, 0, 0), 
                title: "Parada 6: Orquideas de Kyo",
                flower: '<img src="orquideas.png" class="flower-img">',
                 message: "<b>feliz cumpleaños, nat bebé. espero que pases un día muy bonito rodeado de toda la gente que te estima, que todos tus deseos se vuelvan realidad y que puedas darle muchas vueltitas más al sol, te quiero muchote.</b>"   
            },
            {
                targetDate: new Date(2020, 8, 20, 0, 0, 0), 
                title: "Parada 7: Rosas de Daddy",
                flower: '<img src="rosas.png" class="flower-img">',
                 message: "<b>Tu siguiente tarea es escoger una o varias flores de cada set, y ponerlas en la canasta de tu bici. Puedes dejar las demás aquí, serán tu jardín en casa.</b>"   
            },
                        {
                targetDate: new Date(2020, 8, 20, 0, 0, 0), 
                title: "Destino Final: ",
                flower: '<img src="finalpic.jpg" class="flower-img">',
                message: "La última nota, la dejó en la puerta del cobertizo, para proteger su siguiente regalo, y a su prometido de miradas indeseadas, aunque en el lugar no hubiese más que las personas del staff, lejos de la vista, pero listas en caso de ser necesitadas.<br><br>“Ya tienes tu ramo, ahora sigue tu vestido. Seguro Sebastian te puede ayudar de ser necesario, así que te espero al final del camino.”<br><br><div class=\"message-gallery\"><img src=\"frontdress.jpg\" class=\"gallery-img\"><img src=\"backdress.jpg\" class=\"gallery-img\"></div>"
            }

        ];

        let currentStage = 0;
        let timerInterval;

        function updateCountdown() {
            if (currentStage >= stages.length) {
                document.getElementById('route-title').innerText = "¡Llegamos al inicio de una nueva etapa en nuestra vida juntos!";
                
                // Corregido a innerHTML para que muestre la foto real
                document.getElementById('flower').innerHTML = '<img src="arch.jpg" class="flower-img">';
                
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('content').innerHTML = "<p style='text-align:center; font-size:1.3rem;'><b>Cuando estés listo para dar este paso, te estaré esperando siempre.</b></p>";
                document.getElementById('content').style.display = 'block';
                clearInterval(timerInterval);
                return;
            }

            const now = new Date().getTime();
            const target = stages[currentStage].targetDate.getTime();
            const difference = target - now;

            if (difference <= 0) {
                clearInterval(timerInterval);
                document.getElementById('route-title').innerText = stages[currentStage].title;
                
                // CAMBIADO A innerHTML AQUÍ TAMBIÉN (Muy importante)
                document.getElementById('flower').innerHTML = stages[currentStage].flower;
                document.getElementById('countdown').style.display = 'none';
                
                let nextBtnText = currentStage === stages.length - 1 ? "comenzar nuestra historia" : "seguir pedaleando ➔";
                let nextButton = `<br><button onclick="nextStage()">${nextBtnText}</button>`;
                
                let messageContent = stages[currentStage].message;
                document.getElementById('content').innerHTML = `${messageContent}${nextButton}`;
                document.getElementById('content').style.display = 'block';
            } else {
                document.getElementById('route-title').innerText = "pedaleando...";
                
                // CAMBIADO A innerHTML AQUÍ TAMBIÉN
                document.getElementById('flower').innerHTML = "🚲💨🌸";
                document.getElementById('countdown').style.display = 'block';
                document.getElementById('content').style.display = 'none';

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerText = 
                    `${days}d ${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }


        function nextStage() {
            currentStage++;
            updateCountdown();
            if (currentStage < stages.length) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
        }

        updateCountdown();
        timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
