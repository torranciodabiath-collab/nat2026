<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños! 🎂</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            color: #4a5568;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #ff4d6d; margin-bottom: 10px; }
        .timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff758f;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #590d22;
            display: none;
            animation: fadeIn 1s ease-in-out forwards;
        }
        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="title">Cargando sorpresa...</h1>
        <div id="countdown" class="timer">00:00:00</div>
        <div id="content" class="message"></div>
    </div>

    <script>
        // CONFIGURA AQUÍ TUS FECHAS Y MENSAJES (Formato: Año, Mes [0-11], Día, Hora, Minuto)
        // Nota: Enero es 0, Febrero es 1, Marzo es 2... Diciembre es 11.
        const stages = [
            {
                targetDate: new Date(2026, 8, 15, 0, 0, 0), // Ejemplo: 15 de Septiembre de 2026, 12:00 AM
                title: "Sorpresa 1",
                message: "¡Feliz pre-cumpleaños! Eres una persona increíble y este es solo el inicio de las sorpresas. ❤️"
            },
            {
                targetDate: new Date(2026, 8, 16, 0, 0, 0), // Ejemplo: 16 de Septiembre de 2026, 12:00 AM
                title: "Sorpresa 2",
                message: "¡OFICIALMENTE ES TU CUMPLEAÑOS! Espero que este nuevo año de vida te traiga muchísima felicidad. 🥳🎉"
            }
        ];

        let currentStage = 0;
        let timerInterval;

        function updateCountdown() {
            if (currentStage >= stages.length) {
                document.getElementById('title').innerText = "¡Eso es todo por ahora!";
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('content').innerHTML = "<p>¡Espero que te hayan gustado tus sorpresas! 🎂</p>";
                document.getElementById('content').style.display = 'block';
                clearInterval(timerInterval);
                return;
            }

            const now = new Date().getTime();
            const target = stages[currentStage].targetDate.getTime();
            const difference = target - now;

            if (difference <= 0) {
                // El contador terminó, mostrar mensaje
                clearInterval(timerInterval);
                document.getElementById('title').innerText = stages[currentStage].title;
                document.getElementById('countdown').style.display = 'none';
                
                let nextButton = currentStage < stages.length - 1 ? `<br><button onclick="nextStage()">Ver siguiente cuenta regresiva</button>` : '';
                document.getElementById('content').innerHTML = `<p>${stages[currentStage].message}</p>${nextButton}`;
                document.getElementById('content').style.display = 'block';
            } else {
                // Calcular tiempo restante
                document.getElementById('title').innerText = "Próxima sorpresa en...";
                document.getElementById('countdown').style.display = 'block';
                document.getElementById('content').style.display = 'none';

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerText = 
                    `${days}d ${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }

        function nextStage() {
            currentStage++;
            updateCountdown();
            if (currentStage < stages.length) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
        }

        // Iniciar
        updateCountdown();
        timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
