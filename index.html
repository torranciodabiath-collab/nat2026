<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Camino Juntos 🚲🌸</title>
    
    <!-- 1. Aquí conectamos la tipografía Commissioner desde Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Commissioner:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            /* 2. Aquí le decimos a la página que use Commissioner */
            font-family: 'Commissioner', sans-serif;
            background: linear-gradient(to bottom, #e8f5e9, #c8e6c9);
            color: #2e7d32;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .journey-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            border: 2px solid #a5d6a7;
            position: relative;
        }
        .bike-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: pedalear 3s ease-in-out infinite alternate;
        }
        @keyframes pedalear {
            0% { transform: translateX(-10px) rotate(-3deg); }
            100% { transform: translateX(10px) rotate(3deg); }
        }
        h1 { color: #1b5e20; margin-bottom: 5px; font-size: 1.8rem; }
        .flower-badge {
            font-size: 2.5rem;
            margin: 15px 0;
        }
        .timer {
            font-size: 2.2rem;
            font-weight: bold;
            color: #c2185b;
            background: #fce4ec;
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
            letter-spacing: 1px;
            border: 1px dashed #f48fb1;
        }
        .message-box {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #37474f;
            display: none;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #81c784;
            text-align: left;
            animation: aparecer 0.8s ease-out forwards;
        }
        button {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
            transition: all 0.3s;
            font-weight: bold;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76,175,80,0.4);
        }
        @keyframes aparecer { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
    </style>
</head>
<body>

    <div class="journey-container">
        <div class="bike-icon">🚲💨</div>
        <h1 id="route-title">Tu viaje en bicicleta</h1>
        <div id="flower" class="flower-badge">🌸</div>
        <div id="countdown" class="timer">00:00:00</div>
        <div id="content" class="message-box"></div>
    </div>

    <script>
        // PROGRAMACIÓN DE LA RUTA DE CUMPLEAÑOS
        // Para probar la web HOY, deja el año en 2020. 
        // Cuando ya vayas a entregar el link, cambia TODOS los 2020 por 2026.
        const stages = [
            {
                // Martes 15 de Septiembre
                targetDate: new Date(2020, 8, 15, 0, 0, 0), 
                title: "Parada 1: Un comienzo lleno de girasoles 🌻",
                flower: "🌻",
                message: "<b>¡Feliz Cumpleaños! En esta primera parada recoges un girasol y un mensaje especial de [Amigo 1]:</b><br><br>'Aquí pegas el primer mensaje real que ya tienes listo...'"
            },
            {
                // Miércoles 16 de Septiembre
                targetDate: new Date(2020, 8, 16, 0, 0, 0), 
                title: "Parada 2: El prado de los tulipanes 🌷",
                flower: "🌷",
                message: "<b>¡El viaje continúa! Has recogido un hermoso tulipán elegido por [Amigo 2]:</b><br><br>'Aquí va el mensaje de tu segundo amigo. Si no te lo ha mandado aún, puedes dejar este texto temporal y cambiarlo cuando te responda.'"
            },
            {
                // Jueves 17 de Septiembre
                targetDate: new Date(2020, 8, 17, 0, 0, 0), 
                title: "Parada 3: Un dulce aroma a margaritas 🌼",
                flower: "🌼",
                message: "<b>En esta tercera parada del camino, una nueva flor se une a tu canasta:</b><br><br>¡Alguien muy especial está preparando un mensaje increíble para ti en esta parada! Sigue pedaleando en tu gran viaje de cumpleaños."
            },
            {
                // Viernes 18 de Septiembre
                targetDate: new Date(2020, 8, 18, 0, 0, 0), 
                title: "Parada 4: Flores silvestres en el horizonte 🌺",
                flower: "🌺",
                message: "<b>¡Mira cuántas flores vas acumulando en la bicicleta!:</b><br><br>Esta parada es un espacio reservado para una sorpresa que viene en camino. Las personas que te aman están llenando tu sendero de buenas energías."
            },
            {
                // Sábado 19 de Septiembre
                targetDate: new Date(2020, 8, 19, 0, 0, 0), 
                title: "Parada 5: Un campo de rosas rojas 🌹",
                flower: "🌹",
                message: "<b>La última flor de tus amigos antes del gran destino:</b><br><br>Un hermoso deseo de cumpleaños se está cocinando aquí. Tu ramo de flores silvestres está casi completo."
            },
            {
                // Domingo 20 de Septiembre - EL GRAN FINAL (TU MENSAJE)
                targetDate: new Date(2020, 8, 20, 0, 0, 0), 
                title: "Destino Final: Tu Altar 🏛️❤️💍",
                flower: "💐👰‍♀️",
                message: "Aquí termina el recorrido recogiendo flores, mi amor, porque el camino nos ha traído hasta aquí. Las flores que recolectaste en estos días ahora forman tu ramo de novia.<br><br>Antes de que nos encontremos frente a frente, quiero contarte la historia de cómo llegó ese hermoso vestido a tus manos... [Aquí escribes la historia detallada de su vestido].<br><br>Hoy dejas la bicicleta, porque el siguiente paso de este viaje lo daremos juntos, caminando del brazo hacia el altar. Te amo con todo mi corazón."
            }
        ];

        let currentStage = 0;
        let timerInterval;

        function updateCountdown() {
            if (currentStage >= stages.length) {
                document.getElementById('route-title').innerText = "¡Llegamos al inicio de nuestra vida juntos!";
                document.getElementById('flower').innerText = "👩‍❤️‍👨💒✨";
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('content').innerHTML = "<p style='text-align:center; font-size:1.3rem;'><b>¡Te espero en el altar para comenzar nuestra mayor aventura! 💍❤️</b></p>";
                document.getElementById('content').style.display = 'block';
                clearInterval(timerInterval);
                return;
            }

            const now = new Date().getTime();
            const target = stages[currentStage].targetDate.getTime();
            const difference = target - now;

            if (difference <= 0) {
                clearInterval(timerInterval);
                document.getElementById('route-title').innerText = stages[currentStage].title;
                document.getElementById('flower').innerText = stages[currentStage].flower;
                document.getElementById('countdown').style.display = 'none';
                
                let nextBtnText = currentStage === stages.length - 1 ? "Comenzar nuestra historia ✨" : "Seguir pedaleando a la siguiente parada 🚲";
                let nextButton = `<br><button onclick="nextStage()">${nextBtnText}</button>`;
                
                document.getElementById('content').innerHTML = `<p>${stages[currentStage].message}</p>${nextButton}`;
                document.getElementById('content').style.display = 'block';
            } else {
                document.getElementById('route-title').innerText = "Pedaleando hacia la próxima parada...";
                document.getElementById('flower').innerText = "🚲💨🌸";
                document.getElementById('countdown').style.display = 'block';
                document.getElementById('content').style.display = 'none';

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerText = 
                    `${days}d ${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }

        function nextStage() {
            currentStage++;
            updateCountdown();
            if (currentStage < stages.length) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
        }

        updateCountdown();
        timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
