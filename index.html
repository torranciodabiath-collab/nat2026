<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Camino Juntos</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Commissioner:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        @import url('https://googleapis.com');
        body {
            font-family: 'Commissioner', sans-serif;
            background: linear-gradient(to bottom, #e8f5e9, #c8e6c9);
            color: #2e7d32;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .journey-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            border: 2px solid #a5d6a7;
            position: relative;
        }
        .bike-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: pedalear 3s ease-in-out infinite alternate;
        }
        @keyframes pedalear {
            0% { transform: translateX(-10px) rotate(-3deg); }
            100% { transform: translateX(10px) rotate(3deg); }
        }
        h1 { color: #1b5e20; margin-bottom: 5px; font-size: 1.8rem; }
        .flower-badge {
            font-size: 2.5rem;
            margin: 15px 0;
        }
        .flower-img {
            max-width: 160px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            margin: 10px 0;
            border: 3px solid #ffffff;
        }
        .timer {
            font-size: 2.2rem;
            font-weight: bold;
            color: #c2185b;
            background: #fce4ec;
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
            letter-spacing: 1px;
            border: 1px dashed #f48fb1;
        }
        .message-box {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #37474f;
            display: none;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            animation: aparecer 0.8s ease-out forwards;
        }
        button {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(76,175,80,0.3);
            transition: all 0.3s;
            font-weight: bold;
            font-family: 'Commissioner', sans-serif;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76,175,80,0.4);
        }
        @keyframes aparecer { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
    </style>
</head>
<body>

    <div class="journey-container">
        <div class="bike-icon">--</div>
        <h1 id="route-title">Tu viaje en bicicleta</h1>
        <div id="flower" class="flower-badge">--</div>
        <div id="countdown" class="timer">00:00:00</div>
        <div id="content" class="message-box"></div>
    </div>

    <script>
        const stages = [
            {
                targetDate: new Date(2020, 8, 15, 0, 0, 0), 
                title: "Parada 1: Cosmos de Cassiopea",
                flower: '<img src="cosmos.png" class="flower-img">',
                message: "Queridísimo Natsu, estoy segura que sería más feliz de conocernos un poco mejor. Sin embargo, lo que tenemos me ha bastado para saber el tipo de persona que eres y lo bonito de tu personalidad; has sido muy amable conmigo, así que lo aprecio.<br><br>Y por primera vez te puedo felicitar en tu cumpleaños. ¡Espero que sea grandioso!, me encantan como fechas a recordar y recopilar amor, muchos regalos y comida deliciosa~ que seas super duper feliz, agradezco el chance de participar y desearte cosas bonitas. Que de aquí a un año crezcas más y tengas experiencias qué recordar tal como las tienes ahora, titititi.<br><br><b>Con muchísimo cariño, Cass</b>"
            },
            {
                targetDate: new Date(2020, 8, 16, 0, 0, 0), 
                title: "Parada 2: Miniorquídeas de Kuro",
                flower: '<img src="miniorquideas.png" class="flower-img">',
                message: "<b>Mensaje</b><br><br>'Firma.'"
            },
            {
                targetDate: new Date(2020, 8, 17, 0, 0, 0), 
                title: "Parada 3: ",
                flower: "🌼",
                message: "<b>Mensaje</b><br><br>'Firma.'"
            },
            {
                targetDate: new Date(2020, 8, 18, 0, 0, 0), 
                title: "Parada 4: ",
                flower: "🌺",
               message: "<b>Mensaje</b><br><br>'Firma.'"
            },
            {
                targetDate: new Date(2020, 8, 19, 0, 0, 0), 
                title: "Parada 5: ",
                flower: "🌹",
                 message: "<b>Mensaje</b><br><br>'Firma.'"   
            },
            {
                targetDate: new Date(2020, 8, 20, 0, 0, 0), 
                title: "Destino Final: ",
                flower: '<img src="finalpic.jpg" class="flower-img">',
                message: "Lorem<br><br>Ipsum<br><br>Jeje"
            }
        ];

        let currentStage = 0;
        let timerInterval;

        function updateCountdown() {
            if (currentStage >= stages.length) {
                document.getElementById('route-title').innerText = "¡Llegamos al inicio de una nueva etapa nuestra vida juntos!";
                document.getElementById('flower').innerText = "Fotito";
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('content').innerHTML = "<p style='text-align:center; font-size:1.3rem;'><b>Lorem Ipsum</b></p>";
                document.getElementById('content').style.display = 'block';
                clearInterval(timerInterval);
                return;
            }

            const now = new Date().getTime();
            const target = stages[currentStage].targetDate.getTime();
            const difference = target - now;

            if (difference <= 0) {
                clearInterval(timerInterval);
                document.getElementById('route-title').innerText = stages[currentStage].title;
                document.getElementById('flower').innerHTML = stages[currentStage].flower;
                document.getElementById('countdown').style.display = 'none';
                
                let nextBtnText = currentStage === stages.length - 1 ? "Aquí comienza tu celebración" : "Siguiente parada mágica";
                let nextButton = `<br><button onclick="nextStage()">${nextBtnText}</button>`;
                
                document.getElementById('content').innerHTML = `<p>${stages[currentStage].message}</p>${nextButton}`;
                document.getElementById('content').style.display = 'block';
            } else {
                document.getElementById('route-title').innerText = "Keep  going!";
                document.getElementById('flower').innerHTML = "🚲💨🌸";
                document.getElementById('countdown').style.display = 'block';
                document.getElementById('content').style.display = 'none';

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerText = 
                    `${days}d ${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }

        function nextStage() {
            currentStage++;
            updateCountdown();
            if (currentStage < stages.length) {
                timerInterval = setInterval(updateCountdown, 1000);
            }
        }

        updateCountdown();
        timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
